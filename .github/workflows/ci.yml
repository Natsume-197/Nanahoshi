name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Dummy values so @nanahoshi-v2/env/server validates at import time. Tests
    # mock all real infra (DB, Redis, SMTP); these only satisfy the schema so
    # module-eval doesn't throw. Not secrets — do not use in production.
    env:
      CORS_ORIGIN: http://localhost:3001
      SERVER_URL: http://localhost:3000
      VITE_SERVER_URL: http://localhost:3000
      NAMESPACE_UUID: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
      DOWNLOAD_SECRET: 9b2c1f80-5d3e-4a7b-8c1d-2e3f4a5b6c7d
      BETTER_AUTH_SECRET: ci-test-secret-000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_USER: ci@example.com
      SMTP_PASS: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bunx biome check .
      - run: bun run test
      - run: bun run --cwd apps/web build
      - run: bun run --cwd apps/web test:production-ssr
      - run: docker build --target api -f docker/server/Dockerfile .
      - run: docker build --target worker -f docker/server/Dockerfile .
      - run: docker build --target runner --build-arg VITE_SERVER_URL=http://localhost:3000 -f docker/web/Dockerfile .

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-alpine-16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nanahoshi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nanahoshi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CORS_ORIGIN: http://localhost:3001
      SERVER_URL: http://localhost:3000
      NAMESPACE_UUID: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
      DOWNLOAD_SECRET: 9b2c1f80-5d3e-4a7b-8c1d-2e3f4a5b6c7d
      BETTER_AUTH_SECRET: ci-test-secret-000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: nanahoshi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - name: Verify historical data migration fixture
        run: bun run packages/db/scripts/verify-0093-upgrade.ts
      - name: Verify migration restart idempotency
        run: bun run db:migrate
