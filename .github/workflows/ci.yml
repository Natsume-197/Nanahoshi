name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Code checks & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dummy values so @nanahoshi-v2/env/server validates at import time. Tests
    # mock all real infra (DB, Redis, SMTP); these only satisfy the schema so
    # module-eval doesn't throw. Not secrets — do not use in production.
    env:
      CORS_ORIGIN: http://localhost:3001
      SERVER_URL: http://localhost:3000
      VITE_SERVER_URL: http://localhost:3000
      NAMESPACE_UUID: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
      DOWNLOAD_SECRET: 9b2c1f80-5d3e-4a7b-8c1d-2e3f4a5b6c7d
      BETTER_AUTH_SECRET: ci-test-secret-000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_USER: ci@example.com
      SMTP_PASS: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Fast validation (generate, types, lint, unit tests)
        run: bun run validate
      - run: bun run --cwd apps/web build
      - run: bun run --cwd apps/web test:production-ssr

  migrations:
    name: Database migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-alpine-18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nanahoshi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nanahoshi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CORS_ORIGIN: http://localhost:3001
      SERVER_URL: http://localhost:3000
      NAMESPACE_UUID: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
      DOWNLOAD_SECRET: 9b2c1f80-5d3e-4a7b-8c1d-2e3f4a5b6c7d
      BETTER_AUTH_SECRET: ci-test-secret-000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: nanahoshi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - name: Verify historical data migration fixture
        run: bun run packages/db/scripts/verify-0093-upgrade.ts
      - name: Verify migration restart idempotency
        run: bun run db:migrate

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-alpine-18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: nanahoshi_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nanahoshi_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CORS_ORIGIN: http://localhost:3001
      SERVER_URL: http://localhost:3000
      NAMESPACE_UUID: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
      DOWNLOAD_SECRET: 9b2c1f80-5d3e-4a7b-8c1d-2e3f4a5b6c7d
      BETTER_AUTH_SECRET: ci-integration-secret-000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: integration-only-password
      DB_NAME: nanahoshi_integration
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Run database and queue integration suites
        run: bun run test:integration

  artifacts-smoke:
    name: Build & start Docker application
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api -t nanahoshi-api:ci -f docker/server/Dockerfile .
      - name: Build worker image
        run: docker build --target worker -t nanahoshi-worker:ci -f docker/server/Dockerfile .
      - name: Build web image
        run: docker build --target runner -t nanahoshi-web:ci --build-arg VITE_SERVER_URL=http://localhost:3000 -f docker/web/Dockerfile .
      - name: Smoke-test packaged application stack
        run: bash scripts/ci-container-smoke.sh
        env:
          CONTAINER_SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/container-smoke
      - name: Upload sanitized container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-diagnostics
          path: ${{ runner.temp }}/container-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Ensure container stack is removed
        if: always()
        run: bash scripts/ci-container-smoke.sh cleanup
        env:
          CONTAINER_SMOKE_DIAGNOSTICS_DIR: ${{ runner.temp }}/container-smoke
