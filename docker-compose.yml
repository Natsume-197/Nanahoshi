name: nanahoshi-v2

# Environment shared by the API (server) and worker processes.
x-app-environment: &app-environment
  # General
  ENVIRONMENT: ${ENVIRONMENT:-production}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
  SERVER_URL: ${SERVER_URL:-http://localhost:3000}
  NAMESPACE_UUID: "${NAMESPACE_UUID:?Set NAMESPACE_UUID in .env (generate one with: uuidgen)}"
  DOWNLOAD_SECRET: "${DOWNLOAD_SECRET:?Set DOWNLOAD_SECRET in .env (generate one with: uuidgen)}"
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  # Database
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: "${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}"
  DB_NAME: ${DB_NAME:-nanahoshi-v2}
  # Redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
  # Authentication
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (generate one with: openssl rand -base64 32)}"
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  # Email (optional — only needed for email invitations and Send to Kindle)
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  # Scan queue backpressure
  SCAN_QUEUE_HIGH_WATERMARK: ${SCAN_QUEUE_HIGH_WATERMARK:-2000}
  SCAN_QUEUE_LOW_WATERMARK: ${SCAN_QUEUE_LOW_WATERMARK:-1000}
  SCAN_QUEUE_BATCH_SIZE: ${SCAN_QUEUE_BATCH_SIZE:-250}
  SCAN_QUEUE_POLL_MS: ${SCAN_QUEUE_POLL_MS:-250}
  SCAN_CHECKPOINT_ROWS: ${SCAN_CHECKPOINT_ROWS:-500}
  SCAN_CHECKPOINT_INTERVAL_MS: ${SCAN_CHECKPOINT_INTERVAL_MS:-30000}
  SCAN_STAT_CONCURRENCY: ${SCAN_STAT_CONCURRENCY:-}
  SCAN_HASH_CONCURRENCY: ${SCAN_HASH_CONCURRENCY:-}

services:
  # ── Application ────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: api
    container_name: nanahoshi-v2-server
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      <<: *app-environment
    # Both server and worker need the same mounts: the worker scans/ingests
    # the books and writes covers, the server serves them.
    volumes: &app-volumes
      - server_data:/app/apps/server/data
      # Mount your book directories here. Add as many as you need.
      # Then create libraries in the admin UI pointing to these paths.
      # Example:
      #   - /path/to/your/manga:/books/manga:ro
      #   - /path/to/your/novels:/books/novels:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Background jobs (scans, metadata enrichment, covers) in their own
  # process so heavy tasks never block the API. cpu_shares is a relative
  # weight, not a cap: the worker dynamically uses about 75% of the CPUs it
  # can see, and under contention the server/db/redis win ~8:1.
  worker:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      target: worker
    container_name: nanahoshi-v2-worker
    cpu_shares: 128
    pids_limit: ${WORKER_PIDS_LIMIT:-128}
    environment:
      <<: *app-environment
      PROCESS_ROLE: worker
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3000}
    container_name: nanahoshi-v2-web
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      ENVIRONMENT: production
      SERVER_URL: http://server:3000
    depends_on:
      - server
    restart: unless-stopped

  # ── Infrastructure ─────────────────────────────────────────────────
  postgres:
    image: groonga/pgroonga:4.0.8-alpine-16
    container_name: nanahoshi-v2-postgres
    # PostgreSQL uses POSIX dynamic shared memory for parallel query workers.
    # Docker's 64MB default is smaller than this stack's concurrent DB budget;
    # keep enough headroom for unrelated plans even though duplicate grouping
    # is indexed and no longer expected to build catalog-wide parallel hashes.
    shm_size: 512mb
    # Stock Postgres defaults assume ~1GB machines: 128MB cache and 4MB sorts
    # (which spill to disk on a 40k-book catalog). Sized for a 16GB host shared
    # with the app; jit off — LLVM compile bursts on ARM hurt short OLTP queries.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
    environment:
      POSTGRES_DB: ${DB_NAME:-nanahoshi-v2}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nanahoshi-v2-redis
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  server_data:
