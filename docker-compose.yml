name: nanahoshi

services:
  server:
    stop_grace_period: 40s
    image: ghcr.io/natsume-197/nanahoshi:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports: ["${APP_PORT:-7331}:3000"]
    volumes:
      - server_data:/app/apps/server/data
      - ./books:/books
      - updater:/var/lib/nanahoshi-updater
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Installs new releases when an admin chooses Update in Settings › Updates.
  # It holds the Docker socket so the server never does, and only ever pulls
  # the server's own image tag and recreates that one container with the same
  # settings. Remove this service to update by hand (docker compose pull && up -d).
  updater:
    image: ghcr.io/natsume-197/nanahoshi:latest
    restart: unless-stopped
    entrypoint: ["bun", "/app/apps/server/dist/updater.mjs"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater:/var/lib/nanahoshi-updater

  postgres:
    image: groonga/pgroonga:4.0.8-alpine-18
    restart: unless-stopped
    shm_size: 256mb
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "jit=off"]
    environment:
      POSTGRES_DB: ${DB_NAME:-nanahoshi}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  server_data:
  redis_data:
  updater:
